<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>2026级医学信息工程</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #06060f;
            color: #e0e6f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            padding-top: 60px;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: radial-gradient(ellipse at 30% 20%, rgba(180, 77, 255, .06), transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(0, 240, 255, .04), transparent 50%);
        }
        :root {
            --bg: #06060f;
            --bg-card: rgba(12, 12, 30, .85);
            --bg-card-hover: rgba(20, 20, 50, .95);
            --text: #e0e6f0;
            --text-2: #8892a8;
            --text-3: #4a5568;
            --border: rgba(0, 240, 255, .12);
            --border-hover: rgba(0, 240, 255, .3);
            --primary: #00f0ff;
            --primary-dim: rgba(0, 240, 255, .15);
            --secondary: #b44dff;
            --secondary-dim: rgba(180, 77, 255, .15);
            --glass-blur: blur(12px);
        }
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0; height: 60px;
            background: rgba(6, 6, 15, .85);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 999;
            box-shadow: 0 2px 20px rgba(0, 0, 0, .5);
        }
        .navbar .logo {
            font-size: 1.1rem; font-weight: 700;
            background: linear-gradient(135deg, #00f0ff, #b44dff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: .5px;
        }
        .navbar .logo span {
            -webkit-text-fill-color: #8892a8; font-weight: 400; margin-left: 4px;
        }
        .nav-links { display: flex; gap: 16px; list-style: none; }
        .nav-links a {
            color: #8892a8; text-decoration: none; font-size: .85rem; font-weight: 500;
            padding: 8px 4px; transition: color .2s; touch-action: manipulation;
        }
        .nav-links a:hover, .nav-links a.active { color: #00f0ff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        #classmates { padding: 20px 0 40px; }
        .section-title {
            font-size: 1.8rem; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            text-align: center; margin-bottom: 4px;
        }
        .section-subtitle { text-align: center; color: var(--text-2); font-size: .9rem; margin-bottom: 24px; letter-spacing: .3px; }
        .cm-stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
        .map-stat {
            text-align: center; padding: 12px 16px; border-radius: 12px; background: var(--bg-card);
            border: 1px solid var(--border); min-width: 80px; flex: 1 0 auto; max-width: 140px;
            -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
        }
        .map-stat .num {
            font-size: 1.8rem; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .map-stat .label { font-size: .7rem; color: var(--text-3); margin-top: 2px; }
        .classmates-map-wrap { display: flex; flex-direction: column; gap: 16px; }
        .classmates-map-left { flex: 1 1 auto; min-width: 0; }
        .classmates-svg-wrap {
            width: 100%; height: auto; aspect-ratio: 700/580; background: #0c0c1e;
            border-radius: 16px; border: 1px solid var(--border); overflow: hidden; position: relative;
        }
        .classmates-svg-wrap svg { display: block; width: 100%; height: 100%; }
        .cm-legend {
            display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 10px 12px;
            background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border); margin-top: 12px;
        }
        .cm-legend-item { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--text-2); }
        .cm-legend-dot { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }
        .classmates-map-right {
            flex: 1 1 auto; max-height: 360px; overflow-y: auto; background: var(--bg-card);
            border-radius: 16px; border: 1px solid var(--border); padding: 4px 0;
            -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
        }
        .classmates-map-right::-webkit-scrollbar { width: 3px; }
        .classmates-map-right::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
        .cm-list-note {
            text-align: center; font-size: .7rem; color: var(--text-3); padding: 8px 10px;
            border-bottom: 1px solid var(--border); letter-spacing: .3px;
        }
        .cm-rank-row {
            display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; min-height: 48px;
            border-radius: 10px; cursor: pointer; transition: background .2s,border-color .2s;
            border-left: 3px solid transparent; touch-action: manipulation;
        }
        .cm-rank-row:active { background: var(--primary-dim); }
        .cm-rank-row:hover { background: var(--bg-card-hover); border-left-color: var(--primary); }
        .cm-rank-row.cm-active { background: var(--primary-dim); border-left-color: var(--primary); }
        .cm-rank-num { font-size: .7rem; font-weight: 600; color: var(--text-3); min-width: 22px; padding-top: 2px; }
        .cm-rank-name { font-weight: 600; font-size: .9rem; color: var(--text); }
        .cm-rank-names { font-size: .7rem; color: var(--text-2); margin-top: 1px; white-space: normal; overflow: visible; display: block; }
        .cm-rank-count { font-size: .8rem; font-weight: 600; color: var(--secondary); margin-left: auto; white-space: nowrap; padding-top: 2px; }
        .cm-path {
            fill: rgba(180, 77, 255, .08); stroke: rgba(0, 240, 255, .25); stroke-width: .8;
            transition: fill .2s,stroke .2s,filter .2s; cursor: pointer; vector-effect: non-scaling-stroke;
        }
        .cm-path.cm-has { fill: rgba(180, 77, 255, .25); }
        @media (hover:hover) {
            .cm-path:hover, .cm-path.cm-active {
                fill: rgba(180, 77, 255, .55); stroke: var(--primary); stroke-width: 1.5;
                filter: drop-shadow(0 0 12px rgba(180, 77, 255, .4));
            }
        }
        .cm-path.cm-active {
            fill: rgba(180, 77, 255, .55); stroke: var(--primary); stroke-width: 1.5;
            filter: drop-shadow(0 0 12px rgba(180, 77, 255, .4));
        }
        .cm-flight { fill: none; stroke-width: .8; opacity: .6; }
        .cm-flight-anim { stroke-dasharray: 12 8; animation: cmFlightDash 2s linear infinite; }
        @keyframes cmFlightDash { to { stroke-dashoffset: -20; } }
        .cm-flight-particle { fill: var(--primary); filter: drop-shadow(0 0 6px var(--primary)); will-change: transform; }
        .cm-tooltip {
            position: fixed; pointer-events: none; padding: 10px 14px; border-radius: 12px;
            background: rgba(12, 12, 30, .94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
            border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,.6),0 0 20px rgba(180,77,255,.3);
            max-width: 240px; opacity: 0; transform: translateY(4px) scale(.96); transition: opacity .2s,transform .2s; z-index: 999;
        }
        .cm-tooltip.show { opacity: 1; transform: translateY(0) scale(1); }
        .cm-tt-name { font-weight: 700; font-size: .95rem; color: var(--text); margin-bottom: 2px; }
        .cm-tt-count { font-size: .8rem; color: var(--secondary); margin-bottom: 2px; }
        .cm-tt-names { font-size: .7rem; color: var(--text-2); line-height: 1.4; }
        @media (min-width:768px) {
            body { padding-top: 70px; }
            .navbar { height: 64px; padding: 0 40px; }
            .navbar .logo { font-size: 1.2rem; }
            .nav-links { gap: 28px; }
            .nav-links a { font-size: .9rem; }
            .container { padding: 0 24px; }
            .section-title { font-size: 2.2rem; }
            .section-subtitle { font-size: 1rem; }
            .cm-stats { gap: 24px; }
            .map-stat { padding: 16px 28px; min-width: 120px; }
            .map-stat .num { font-size: 2rem; }
            .classmates-map-wrap { flex-direction: row; align-items: stretch; }
            .classmates-map-left { flex: 1 1 65%; }
            .classmates-map-right { flex: 1 1 30%; max-height: 580px; min-width: 240px; }
            .cm-rank-row { min-height: 52px; padding: 10px 16px; }
        }
        @media (min-width:1024px) { .container { padding: 0 40px; } }
        .cm-rank-row, .nav-links a, .cm-legend-item, .map-stat { min-height: 44px; display: flex; align-items: center; }
    </style>
</head>

            "台湾": { "name": "台湾省", "adcode": 710000, "path": "M529.29,357.89L531.48,360.14L532.15,363.67L533.85,364.17L535.26,356.92L540.25,350.07L542.61,339.27L545.3,334.41L544.85,330.97L546.71,329.11L542.39,325.82L535.74,328.67L525.5,343.73L524.57,350.79L525.84,351.61L527.41,356.56L529.29,357.89Z", "center": [541.12, 328.63] },
            "香港": { "name": "香港特别行政区", "adcode": 810000, "path": "M458.08,357.19L456.82,358.15L458.02,358.94L456.6,359.39L456.06,360.71L457.69,360.54L458.51,359.18L460.68,360.6L460.87,358.51L462.11,358.79L461.35,357.47L460.18,358.05L461.52,357.2L460.62,356.7L458.08,357.19Z", "center": [459.66,359.26] },
            "澳门": { "name": "澳门特别行政区", "adcode": 820000, "path": "M452.78,361.65L453.33,361.37L453.02,360.67L452.83,360.47L452.6,360.5L452.56,360.9L452.78,361.25L452.78,361.65Z", "center": [452.72,360.62] }
        };

        var CLASSMATES = {
            "海南": {count:17, names:["蒙钟晓","朱笔青","易素洁","王贞欣","王锴","王俊","梁小兵","梁弘扬","林千华","林文祺","符永宝","陈子准","陈川逸","陈延骏","杨政鑫","王瑞瑄","王森"]},
            "福建": {count:2, names:["黄龙涛","陈祺锋"]},
            "河北": {count:2, names:["贾金堃","张义涵"]},
            "山东": {count:5, names:["尤汉廷","马耀","华闻博","李凤仪","吴雨真"]},
            "陕西": {count:3, names:["张楚晗","李世豪","徐肖"]},
            "辽宁": {count:2, names:["刘艺乔","徐萌锴"]},
            "安徽": {count:4, names:["牛怡冉","王良邦","李家鑫","刘轻扬"]},
            "江苏": {count:1, names:["田宇航"]},
            "云南": {count:3, names:["王梓豪","杨智涵","杨婷"]},
            "山西": {count:3, names:["陈昱霖","郝世诚","黄智越"]},
            "湖南": {count:3, names:["李淑珍","黄心伊","凌钟荣"]},
            "河南": {count:3, names:["李旭蕊","胡鑫雨","张慧琪"]},
            "湖北": {count:2, names:["张诗睿","姜一梦"]},
            "重庆": {count:2, names:["李京蔓","彭臣诚"]},
            "甘肃": {count:2, names:["史万荣","王斯宇"]},
            "广西": {count:2, names:["吴鑫","蒙思然"]},
            "浙江": {count:2, names:["叶铭磊","张起睿"]},
            "贵州": {count:2, names:["张念","杨梦瑶"]}
        };

        // 姓氏笔画数（简体常用姓氏）
        var STROKE = {
            "马": 3, "王": 4, "尤": 4, "牛": 4, "田": 5, "史": 5, "叶": 5,
            "华": 6, "刘": 6, "朱": 6,
            "李": 7, "吴": 7, "陈": 7, "杨": 7, "张": 7, "何": 7,
            "林": 8, "易": 8,
            "郝": 9, "姜": 9, "胡": 9,
            "贾": 10, "徐": 10, "凌": 10,
            "黄": 11, "符": 11, "梁": 11,
            "彭": 12, "蒙": 13
        };
        function sortNamesByStroke(names) {
            var arr = names.slice();
            arr.sort(function(a, b) {
                var sa = STROKE[a.charAt(0)] || 99;
                var sb = STROKE[b.charAt(0)] || 99;
                if (sa !== sb) return sa - sb;
                return a.localeCompare(b, 'zh');
            });
            return arr;
        }

        function animateCounter(el) {
            var target = parseFloat(el.getAttribute('data-target'));
            var duration = 1500;
            var start = null;
            function step(timestamp) {
                if (!start) start = timestamp;
                var progress = Math.min((timestamp - start) / duration, 1);
                var eased = 1 - Math.pow(1 - progress, 3);
                el.textContent = Math.round(target * eased);
                if (progress < 1) window.requestAnimationFrame(step);
            }
            window.requestAnimationFrame(step);
        }

        (function initClassmatesMap() {
            var mapEl = document.getElementById('classmatesMap');
            var tooltip = document.getElementById('cmTooltip');
            var rankEl = document.getElementById('cmRankList');
            var legendEl = document.getElementById('cmLegend');
            if (!mapEl) return;

            var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 700 580');
            var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            defs.innerHTML = '<filter id="cmGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
            svg.appendChild(defs);

            function getCmColor(count) {
                if (count >= 11) return 'rgba(180,77,255,0.85)';
                if (count >= 6) return 'rgba(180,77,255,0.6)';
                if (count >= 4) return 'rgba(180,77,255,0.42)';
                if (count >= 2) return 'rgba(180,77,255,0.28)';
                return 'rgba(180,77,255,0.16)';
            }

            for (var key in window.PROVINCE_PATHS) {
                if (!window.PROVINCE_PATHS.hasOwnProperty(key)) continue;
                var data = window.PROVINCE_PATHS[key];
                var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', data.path);
                path.setAttribute('data-province', key);
                path.classList.add('cm-path');
                if (CLASSMATES[key]) {
                    path.classList.add('cm-has');
                    path.style.fill = getCmColor(CLASSMATES[key].count);
                }
                (function(provinceKey, provData) {
                    path.addEventListener('mouseenter', function() {
                        var cm = CLASSMATES[provinceKey];
                        var html = '<div class="cm-tt-name">' + provData.name + '</div>';
                        if (cm) {
                            html += '<div class="cm-tt-count">' + cm.count + '位同学</div>';
                    html += '<div class="cm-tt-names">' + sortNamesByStroke(cm.names).join('、') + '</div>';
                        } else {
                            html += '<div class="cm-tt-count" style="color:var(--text-3)">暂无同学</div>';
                        }
                        tooltip.innerHTML = html;
                        tooltip.classList.add('show');
                    });
                    path.addEventListener('mousemove', function(e) {
                        var x = e.clientX + 12, y = e.clientY + 12;
                        if (x + 240 > window.innerWidth) x = e.clientX - 250;
                        if (y + 100 > window.innerHeight) y = e.clientY - 110;
                        tooltip.style.left = x + 'px';
                        tooltip.style.top = y + 'px';
                    });
                    path.addEventListener('mouseleave', function() { tooltip.classList.remove('show'); });
                    path.addEventListener('click', function() {
                        var rows = rankEl.querySelectorAll('.cm-rank-row');
                        for (var i = 0; i < rows.length; i++) rows[i].classList.remove('cm-active');
                        var row = rankEl.querySelector('[data-province="' + provinceKey + '"]');
                        if (row) { row.classList.add('cm-active'); row.scrollIntoView({behavior:'smooth', block:'nearest'}); }
                    });
                })(key, data);
                svg.appendChild(path);
            }

            mapEl.appendChild(svg);

            // 绘制飞线粒子动画（已恢复）
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                drawFlightRoutes(svg, defs);
            }

            function drawFlightRoutes(svg, defs) {
                var hainanPath = svg.querySelector('[data-province="海南"]');
                if (!hainanPath) return;
                var hainanCenter = window.PROVINCE_PATHS["海南"].center;
                var hx = hainanCenter[0] - 6;
                var hy = hainanCenter[1] + 4;
                var flightGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                flightGroup.setAttribute('class', 'cm-flight-group');
                var idx = 0;
                for (var provinceKey in CLASSMATES) {
                    if (!CLASSMATES.hasOwnProperty(provinceKey) || provinceKey === '海南') continue;
                    var pathEl = svg.querySelector('[data-province="' + provinceKey + '"]');
                    if (!pathEl) continue;
                    var sb = pathEl.getBBox();
                    var sx0 = sb.x + sb.width / 2;
                    var sy0 = sb.y + sb.height / 2;
                    var dx = hx - sx0, dy = hy - sy0;
                    var dist = Math.sqrt(dx*dx + dy*dy) || 1;
                    var ux = dx / dist, uy = dy / dist;
                    var px = -uy, py = ux;
                    var bundle = Math.min(dist * 0.22, 80);
                    var count = CLASSMATES[provinceKey].count;
                    for (var i = 0; i < count; i++) {
                        var t = count === 1 ? 0 : (i / (count - 1)) * 2 - 1;
                        var startOff = bundle * 0.12 * t;
                        var sx = sx0 + ux * (dist * 0.02) + px * startOff;
                        var sy = sy0 + uy * (dist * 0.02) + py * startOff;
                        var cpOff = bundle * 0.45 * t;
                        var cx = sx0 + ux * (dist * 0.55) + px * cpOff;
                        var cy = sy0 + uy * (dist * 0.55) + py * cpOff;
                        var endOff = bundle * 0.08 * t;
                        var ex = hx + px * endOff;
                        var ey = hy + py * endOff;
                        var gradId = 'cmFlightGrad' + idx;
                        var grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                        grad.setAttribute('id', gradId);
                        grad.setAttribute('gradientUnits', 'userSpaceOnUse');
                        grad.setAttribute('x1', sx.toFixed(2));
                        grad.setAttribute('y1', sy.toFixed(2));
                        grad.setAttribute('x2', ex.toFixed(2));
                        grad.setAttribute('y2', ey.toFixed(2));
                        var stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                        stop1.setAttribute('offset', '0%');
                        stop1.setAttribute('stop-color', '#00f0ff');
                        stop1.setAttribute('stop-opacity', '0.3');
                        grad.appendChild(stop1);
                        var stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                        stop2.setAttribute('offset', '100%');
                        stop2.setAttribute('stop-color', '#b44dff');
                        stop2.setAttribute('stop-opacity', '0.8');
                        grad.appendChild(stop2);
                        defs.appendChild(grad);
                        var flightId = 'cmFlightPath' + idx;
                        var d = 'M ' + sx.toFixed(2) + ' ' + sy.toFixed(2) + ' Q ' + cx.toFixed(2) + ' ' + cy.toFixed(2) + ' ' + ex.toFixed(2) + ' ' + ey.toFixed(2);
                        var line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        line.setAttribute('d', d);
                        line.setAttribute('id', flightId);
                        line.setAttribute('stroke', 'url(#' + gradId + ')');
                        line.setAttribute('class', 'cm-flight cm-flight-anim');
                        line.style.animationDuration = (1.2 + (idx % 6) * 0.15) + 's';
                        flightGroup.appendChild(line);
                        var particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        particle.setAttribute('r', '1.8');
                        particle.setAttribute('class', 'cm-flight-particle');
                        var anim = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
                        anim.setAttribute('dur', (1.4 + (idx % 8) * 0.12) + 's');
                        anim.setAttribute('repeatCount', 'indefinite');
                        anim.setAttribute('calcMode', 'linear');
                        anim.setAttribute('keyPoints', '0;1');
                        anim.setAttribute('keyTimes', '0;1');
                        anim.setAttribute('rotate', 'auto');
                        var mpath = document.createElementNS('http://www.w3.org/2000/svg', 'mpath');
                        mpath.setAttribute('href', '#' + flightId);
                        anim.appendChild(mpath);
                        particle.appendChild(anim);
                        flightGroup.appendChild(particle);
                        idx++;
                    }
                }
                svg.appendChild(flightGroup);
            }

            var cmEntries = [];
            for (var k in CLASSMATES) {
                if (CLASSMATES.hasOwnProperty(k)) cmEntries.push([k, CLASSMATES[k]]);
            }
            cmEntries.sort(function(a, b) { return b[1].count - a[1].count; });

            var html = '';
            for (var i = 0; i < cmEntries.length; i++) {
                var key = cmEntries[i][0], data = cmEntries[i][1];
                html += '<div class="cm-rank-row" data-province="' + key + '">' +
                    '<span class="cm-rank-num">' + (i + 1) + '</span>' +
                    '<div style="flex:1"><div class="cm-rank-name">' + key + '</div>' +
                    '<div class="cm-rank-names">' + sortNamesByStroke(data.names).join('、') + '</div></div>' +
                    '<span class="cm-rank-count">' + data.count + '人</span></div>';
            }
            rankEl.innerHTML = html;

            var rows = rankEl.querySelectorAll('.cm-rank-row');
            for (var j = 0; j < rows.length; j++) {
                (function(row) {
                    row.addEventListener('mouseenter', function() {
                        var p = svg.querySelector('[data-province="' + row.getAttribute('data-province') + '"]');
                        if (p) p.classList.add('cm-active');
                    });
                    row.addEventListener('mouseleave', function() {
                        var p = svg.querySelector('[data-province="' + row.getAttribute('data-province') + '"]');
                        if (p) p.classList.remove('cm-active');
                    });
                    row.addEventListener('click', function() {
                        var all = svg.querySelectorAll('.cm-path');
                        for (var m = 0; m < all.length; m++) all[m].classList.remove('cm-active');
                        var p = svg.querySelector('[data-province="' + row.getAttribute('data-province') + '"]');
                        if (p) p.classList.add('cm-active');
                    });
                })(rows[j]);
            }

            var levels = [
                {color:'rgba(180,77,255,0.16)', label:'1人'},
                {color:'rgba(180,77,255,0.28)', label:'2-3人'},
                {color:'rgba(180,77,255,0.42)', label:'4-5人'},
                {color:'rgba(180,77,255,0.6)', label:'6-10人'},
                {color:'rgba(180,77,255,0.85)', label:'11+人'}
            ];
            var legendHtml = '';
            for (var l = 0; l < levels.length; l++) {
                legendHtml += '<div class="cm-legend-item"><div class="cm-legend-dot" style="background:' + levels[l].color + '"></div>' + levels[l].label + '</div>';
            }
            legendEl.innerHTML = legendHtml;

            var counters = document.querySelectorAll('.counter-num');
            for (var c = 0; c < counters.length; c++) {
                animateCounter(counters[c]);
            }
        })();
    </script>
