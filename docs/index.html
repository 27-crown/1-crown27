<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>2026级医学信息工程本 · 同学分布</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #06060f;
            color: #e0e6f0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            padding-top: 60px;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: radial-gradient(ellipse at 30% 20%, rgba(180, 77, 255, .06), transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(0, 240, 255, .04), transparent 50%);
        }
        :root {
            --bg: #06060f;
            --bg-card: rgba(12, 12, 30, .85);
            --bg-card-hover: rgba(20, 20, 50, .95);
            --text: #e0e6f0;
            --text-2: #8892a8;
            --text-3: #4a5568;
            --border: rgba(0, 240, 255, .12);
            --border-hover: rgba(0, 240, 255, .3);
            --primary: #00f0ff;
            --primary-dim: rgba(0, 240, 255, .15);
            --secondary: #b44dff;
            --secondary-dim: rgba(180, 77, 255, .15);
            --glass-blur: blur(12px);
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(6, 6, 15, .85);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 999;
            box-shadow: 0 2px 20px rgba(0, 0, 0, .5);
        }
        .navbar .logo {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f0ff, #b44dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: .5px;
        }
        .navbar .logo span {
            -webkit-text-fill-color: #8892a8;
            font-weight: 400;
            margin-left: 4px;
        }
        .nav-links {
            display: flex;
            gap: 16px;
            list-style: none;
        }
        .nav-links a {
            color: #8892a8;
            text-decoration: none;
            font-size: .85rem;
            font-weight: 500;
            padding: 8px 4px;
            transition: color .2s;
            touch-action: manipulation;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #00f0ff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }
        #classmates {
            padding: 20px 0 40px;
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 4px;
        }
        .section-subtitle {
            text-align: center;
            color: var(--text-2);
            font-size: .9rem;
            margin-bottom: 24px;
            letter-spacing: .3px;
        }
        .cm-stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .map-stat {
            text-align: center;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            min-width: 80px;
            flex: 1 0 auto;
            max-width: 140px;
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
        }
        .map-stat .num {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .map-stat .label {
            font-size: .7rem;
            color: var(--text-3);
            margin-top: 2px;
        }
        .classmates-map-wrap {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .classmates-map-left {
            flex: 1 1 auto;
            min-width: 0;
        }
        .classmates-svg-wrap {
            width: 100%;
            height: auto;
            aspect-ratio: 700/580;
            background: #0c0c1e;
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }
        .classmates-svg-wrap svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .cm-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding: 10px 12px;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-top: 12px;
        }
        .cm-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: .75rem;
            color: var(--text-2);
        }
        .cm-legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, .06);
            flex-shrink: 0;
        }
        .classmates-map-right {
            flex: 1 1 auto;
            max-height: 360px;
            overflow-y: auto;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 4px 0;
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
        }
        .classmates-map-right::-webkit-scrollbar {
            width: 3px;
        }
        .classmates-map-right::-webkit-scrollbar-thumb {
            background: var(--border-hover);
            border-radius: 4px;
        }
        .cm-list-note {
            text-align: center;
            font-size: .7rem;
            color: var(--text-3);
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            letter-spacing: .3px;
        }
        .cm-rank-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 14px;
            min-height: 48px;
            border-radius: 10px;
            cursor: pointer;
            transition: background .2s, border-color .2s;
            border-left: 3px solid transparent;
            touch-action: manipulation;
        }
        .cm-rank-row:active {
            background: var(--primary-dim);
        }
        .cm-rank-row:hover {
            background: var(--bg-card-hover);
            border-left-color: var(--primary);
        }
        .cm-rank-row.cm-active {
            background: var(--primary-dim);
            border-left-color: var(--primary);
        }
        .cm-rank-num {
            font-size: .7rem;
            font-weight: 600;
            color: var(--text-3);
            min-width: 22px;
            padding-top: 2px;
        }
        .cm-rank-name {
            font-weight: 600;
            font-size: .9rem;
            color: var(--text);
        }
        .cm-rank-names {
            font-size: .7rem;
            color: var(--text-2);
            margin-top: 1px;
            white-space: normal;
            overflow: visible;
            display: block;
        }
        .cm-rank-count {
            font-size: .8rem;
            font-weight: 600;
            color: var(--secondary);
            margin-left: auto;
            white-space: nowrap;
            padding-top: 2px;
        }
        .cm-path {
            fill: rgba(180, 77, 255, .08);
            stroke: rgba(0, 240, 255, .25);
            stroke-width: .8;
            transition: fill .2s, stroke .2s, filter .2s;
            cursor: pointer;
            vector-effect: non-scaling-stroke;
        }
        .cm-path.cm-has {
            fill: rgba(180, 77, 255, .25);
        }
        @media (hover:hover) {
            .cm-path:hover,
            .cm-path.cm-active {
                fill: rgba(180, 77, 255, .55);
                stroke: var(--primary);
                stroke-width: 1.5;
                filter: drop-shadow(0 0 12px rgba(180, 77, 255, .4));
            }
        }
        .cm-path.cm-active {
            fill: rgba(180, 77, 255, .55);
            stroke: var(--primary);
            stroke-width: 1.5;
            filter: drop-shadow(0 0 12px rgba(180, 77, 255, .4));
        }
        .cm-flight {
            fill: none;
            stroke-width: .8;
            opacity: .6;
        }
        .cm-flight-anim {
            stroke-dasharray: 12 8;
            animation: cmFlightDash 2s linear infinite;
        }
        @keyframes cmFlightDash {
            to {
                stroke-dashoffset: -20;
            }
        }
        .cm-flight-particle {
            fill: var(--primary);
            filter: drop-shadow(0 0 6px var(--primary));
            will-change: transform;
        }
        .cm-tooltip {
            position: fixed;
            pointer-events: none;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(12, 12, 30, .94);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .6), 0 0 20px rgba(180, 77, 255, .3);
            max-width: 240px;
            opacity: 0;
            transform: translateY(4px) scale(.96);
            transition: opacity .2s, transform .2s;
            z-index: 999;
        }
        .cm-tooltip.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .cm-tt-name {
            font-weight: 700;
            font-size: .95rem;
            color: var(--text);
            margin-bottom: 2px;
        }
        .cm-tt-count {
            font-size: .8rem;
            color: var(--secondary);
            margin-bottom: 2px;
        }
        .cm-tt-names {
            font-size: .7rem;
            color: var(--text-2);
            line-height: 1.4;
        }
        @media (min-width:768px) {
            body {
                padding-top: 70px;
            }
            .navbar {
                height: 64px;
                padding: 0 40px;
            }
            .navbar .logo {
                font-size: 1.2rem;
            }
            .nav-links {
                gap: 28px;
            }
            .nav-links a {
                font-size: .9rem;
            }
            .container {
                padding: 0 24px;
            }
            .section-title {
                font-size: 2.2rem;
            }
            .section-subtitle {
                font-size: 1rem;
            }
            .cm-stats {
                gap: 24px;
            }
            .map-stat {
                padding: 16px 28px;
                min-width: 120px;
            }
            .map-stat .num {
                font-size: 2rem;
            }
            .classmates-map-wrap {
                flex-direction: row;
                align-items: stretch;
            }
            .classmates-map-left {
                flex: 1 1 65%;
            }
            .classmates-map-right {
                flex: 1 1 30%;
                max-height: 580px;
                min-width: 240px;
            }
            .cm-rank-row {
                min-height: 52px;
                padding: 10px 16px;
            }
        }
        @media (min-width:1024px) {
            .container {
                padding: 0 40px;
            }
        }
        .cm-rank-row,
        .nav-links a,
        .cm-legend-item,
        .map-stat {
            min-height: 44px;
            display: flex;
            align-items: center;
        }
    </style>
</head>

                        var flightId = 'cmFlightPath' + idx;
                        var d = 'M ' + sx.toFixed(2) + ' ' + sy.toFixed(2) + ' Q ' + cx.toFixed(2) + ' ' + cy.toFixed(2) + ' ' + ex.toFixed(2) + ' ' + ey.toFixed(2);
                        var line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        line.setAttribute('d', d);
                        line.setAttribute('id', flightId);
                        line.setAttribute('stroke', 'url(#' + gradId + ')');
                        line.setAttribute('class', 'cm-flight cm-flight-anim');
                        line.style.animationDuration = (1.2 + (idx % 6) * 0.15) + 's';
                        flightGroup.appendChild(line);
                        var particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        particle.setAttribute('r', '1.8');
                        particle.setAttribute('class', 'cm-flight-particle');
                        var anim = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
                        anim.setAttribute('dur', (1.4 + (idx % 8) * 0.12) + 's');
                        anim.setAttribute('repeatCount', 'indefinite');
                        anim.setAttribute('calcMode', 'linear');
                        anim.setAttribute('keyPoints', '0;1');
                        anim.setAttribute('keyTimes', '0;1');
                        anim.setAttribute('rotate', 'auto');
                        var mpath = document.createElementNS('http://www.w3.org/2000/svg', 'mpath');
                        mpath.setAttribute('href', '#' + flightId);
                        anim.appendChild(mpath);
                        particle.appendChild(anim);
                        flightGroup.appendChild(particle);
                        idx++;
                    }
                }
                svg.appendChild(flightGroup);
            }

            // 渲染列表
            var cmEntries = [];
            for (var k in CLASSMATES) {
                if (CLASSMATES.hasOwnProperty(k)) cmEntries.push([k, CLASSMATES[k]]);
            }
            cmEntries.sort(function(a, b) { return b[1].count - a[1].count; });

            var html = '';
            for (var i = 0; i < cmEntries.length; i++) {
                var key = cmEntries[i][0], data = cmEntries[i][1];
                html += '<div class="cm-rank-row" data-province="' + key + '">' +
                    '<span class="cm-rank-num">' + (i + 1) + '</span>' +
                    '<div style="flex:1"><div class="cm-rank-name">' + key + '</div>' +
                    '<div class="cm-rank-names">' + data.names.join('、') + '</div></div>' +
                    '<span class="cm-rank-count">' + data.count + '人</span></div>';
            }
            rankEl.innerHTML = html;

            var rows = rankEl.querySelectorAll('.cm-rank-row');
            for (var j = 0; j < rows.length; j++) {
                (function(row) {
                    row.addEventListener('mouseenter', function() {
                        var p = svg.querySelector('[data-province="' + row.getAttribute('data-province') + '"]');
                        if (p) p.classList.add('cm-active');
                    });
                    row.addEventListener('mouseleave', function() {
                        var p = svg.querySelector('[data-province="' + row.getAttribute('data-province') + '"]');
                        if (p) p.classList.remove('cm-active');
                    });
                    row.addEventListener('click', function() {
                        var all = svg.querySelectorAll('.cm-path');
                        for (var m = 0; m < all.length; m++) all[m].classList.remove('cm-active');
                        var p = svg.querySelector('[data-province="' + row.getAttribute('data-province') + '"]');
                        if (p) p.classList.add('cm-active');
                    });
                })(rows[j]);
            }

            // 图例
            var levels = [
                {color:'rgba(180,77,255,0.16)', label:'1人'},
                {color:'rgba(180,77,255,0.28)', label:'2-3人'},
                {color:'rgba(180,77,255,0.42)', label:'4-5人'},
                {color:'rgba(180,77,255,0.6)', label:'6-10人'},
                {color:'rgba(180,77,255,0.85)', label:'11+人'}
            ];
            var legendHtml = '';
            for (var l = 0; l < levels.length; l++) {
                legendHtml += '<div class="cm-legend-item"><div class="cm-legend-dot" style="background:' + levels[l].color + '"></div>' + levels[l].label + '</div>';
            }
            legendEl.innerHTML = legendHtml;

            var counters = document.querySelectorAll('.counter-num');
            for (var c = 0; c < counters.length; c++) {
                animateCounter(counters[c]);
            }
        })();
    </script>
</body>
</html>
